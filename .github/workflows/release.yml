name: Release

# Publishes launchkit to npm when a semver tag (v1.2.3) is pushed.
#
# Requires the repo secret NPM_TOKEN (an npm automation token with publish
# rights to the `launchkit` package). Until that secret exists the publish
# step is skipped, so tagging is safe before the package name is claimed.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
